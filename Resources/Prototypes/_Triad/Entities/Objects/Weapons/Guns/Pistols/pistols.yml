- type: entity
  name: HZD Stiletto (.45 magnum)
  parent: [BaseWeaponPistol, BaseGunWieldable, BaseGunToggleable]
  id: WeaponPistolStiletto
  description: A bulky "pistol" designed for the operative in need of a concealable mid-long range option, features a folding stock, scope, and suppressor that massively assists in increasing accuracy.
  components:
  - type: GunToggleableBonus
    minAngle: -3
    maxAngle: -6
    bonusFireRate: -1
    requiresToggle: false
    doAfterTime: 1
  - type: GunChangeShotSoundOnToggled
    sound:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/hawk_fire.ogg
  - type: BlockWieldOnUntoggled
  - type: GunWieldBonus
    minAngle: -1
    maxAngle: -6
  - type: Gun
    minAngle: 5
    maxAngle: 15
    fireRate: 3
    angleIncrease: 9
    angleDecay: 6
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
    availableModes:
    - SemiAuto
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Pistol/stilleto.rsi
    layers:
    - state: stock
      map: ["enum.ToggleableVisuals.Layer"]
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Triad/Objects/Weapons/Guns/Pistol/stiletto_inhands_32x.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: ItemToggleSize
    activatedSize: Large
    activatedShape:
    - 0,0,3,1
  - type: Clothing
    sprite: _Triad/Objects/Weapons/Guns/Pistol/stiletto_inhands_32x.rsi
  - type: ItemToggle
    altPriority: 1
    soundActivate:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/MagIn/m16_magin.ogg
      params:
        variation: 0.2
    soundDeactivate:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/MagIn/m16_magin.ogg
      params:
        variation: 0.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine45_magnumPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine45_magnumPistolFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge45_magnumFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge45_magnumFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: stock }
          False: { state: stock-folded }
  - type: StaticPrice
    price: 500
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 4
    pvsIncrease: 0.4

- type: entity
  name: HZD Dagger (.45 ACP)
  parent: [BaseWeaponPistol, BaseGunWieldable, BaseGunToggleable]
  id: WeaponPistolDagger
  description: An export edition of the pistol given to high-ranking HZD officials or members who've worked for the HZD for an extended period as a reward.  The export model features an integrated flashlight that takes small powercells, a full auto selector, and a folding stock.
  components:
  - type: GunToggleableBonus
    minAngle: -1
    maxAngle: -3
    bonusFireRate: -1
    requiresToggle: false
    doAfterTime: .6
  - type: BlockWieldOnUntoggled
  - type: GunWieldBonus
    minAngle: -1
    maxAngle: -4
  - type: Gun
    minAngle: 6
    maxAngle: 15
    fireRate: 7.5
    angleIncrease: 2
    angleDecay: 4
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/atreides_fire.ogg
    availableModes:
    - FullAuto
    - SemiAuto
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Pistol/dagger.rsi
    layers:
    - state: stock
      map: ["enum.ToggleableVisuals.Layer"]
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Triad/Objects/Weapons/Guns/Pistol/dagger_inhands_32x.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: ItemToggleSize
    activatedSize: Large
    activatedShape:
    - 0,0,3,1
  - type: Clothing
    sprite: _Triad/Objects/Weapons/Guns/SMGs/dagger_inhands_32x.rsi
  - type: ItemToggle
    altPriority: 1
    soundActivate:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/MagIn/m16_magin.ogg
      params:
        variation: 0.2
    soundDeactivate:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/MagIn/m16_magin.ogg
      params:
        variation: 0.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine45_ACPPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine45_ACPPistolFMJ
          - Magazine45_ACPPistolHighCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge45_ACPFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge45_ACPFMJ
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        priority: 3
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      cell_slot: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: stock }
          False: { state: stock-folded }
  - type: StaticPrice
    price: 500
  - type: PointLight
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    radius: 6
    netsync: false
  - type: HandheldLight
    addPrefix: false
      blinkingBehaviourId: blinking
      radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        minValue: 0.1
        maxValue: 2.0
        isLooped: true
  - type: ItemTogglePointLight
  - type: PowerCellSlot
    cellSlotId: cell_slot
