- type: entity
  name: Bastion double-barreled shotgun (4 gauge)
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseFactionGearTDFT3, BaseShipContrabandPermittableTdf]
  id: WeaponShotgunDoubleBarreledTdfBastion
  description: A doom-slaying classic. A military grade double barrel shotgun chambered in 4 gauge. No attachments, no crutches, all skill. Suitable for breaching.
  components:
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Shotgun/tdf_doublebarrel.rsi
  - type: Item
    size: Normal
    shape:
    - 0,0,4,0
    sprite: _Triad/Objects/Weapons/Guns/Shotgun/tdf_doublebarrel_inhand_32x.rsi
  - type: Clothing
    sprite: _Triad/Objects/Weapons/Guns/Shotgun/tdf_doublebarrel_inhand_32x.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GunSpreadModifier #Mono
    spread: 0.4
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/bigshotgun_fire.ogg
    #fireRate: 1 # Goobstation
  - type: Tag
    tags:
    - WeaponShotgunBigBuddy
  - type: BallisticAmmoProvider # Goobstation
    whitelist:
      tags:
      - ShellShotgun23x75mmBuckshot
    proto: ShellShotgun23x75mmBuckshot
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
    capacity: 2
  - type: Construction
    graph: ShotgunSawn
    node: start
    deconstructionTarget: null
  - type: StaticPrice
    price: 5000

- type: entity
  name: HZD Bombadier (12 gauge, 18.5x76mm) #Low Caliber grenade launcher that happens to also fire shotgun shells.
  parent: [BaseItem, BaseGunWieldable]
  id: WeaponShotgunHZDBombadier
  description: A strange, autoloading, multicaliber weapon system often found paired with the Besieger modsuit system, perfect for flushing pirates out of hard cover.  One of the more recent HZD export items, made in lower numbers due to the complexity of internal components, but its engineering and quality is top notch.
  components:
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Shotgun/hzd_bombadier.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
    sprite: _Triad/Objects/Weapons/Guns/Shotgun/hzd_bombadier_inhand_32x.rsi
  - type: Clothing
    sprite: _Triad/Objects/Weapons/Guns/Shotgun/hzd_bombadier_inhand_32x.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: Gun
    fireRate: 2.2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine18.5x76mm
        priority: 2
        whitelist:
          tags:
          - ShortMagazine12_gaugeBuckshot
          - Magazine185x76mm
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 20000
